# Builds the Mlyfo Android keyboard (preview) on GitHub's machines and publishes the APK
# as the "keyboard-preview" release, so it can be installed straight from a phone.
name: Android keyboard

on:
  push:
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mlyfo-keyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mlyfo-keyboard
          path: mlyfo-keyboard.apk
          retention-days: 14
      - name: Publish the preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete keyboard-preview --yes --cleanup-tag 2>/dev/null || true
          gh release create keyboard-preview mlyfo-keyboard.apk --prerelease --target "$GITHUB_SHA" \
            --title "Mlyfo keyboard (Android preview)" \
            --notes "Install mlyfo-keyboard.apk on an Android phone (8.0+), open Mlyfo Keyboard, turn it on and switch to it. Built from ${GITHUB_SHA::7}."
